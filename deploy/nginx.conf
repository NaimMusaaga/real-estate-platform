# Installed by setup-server.sh (with __DOMAIN__ substituted). Certbot adds the HTTPS block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Up to 8 photos x 5 MB per listing upload.
    client_max_body_size 45m;

    root /opt/logai/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — the Upgrade headers are what make WebSockets work behind a proxy.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Listing photos are served straight from disk, never through Node.
    location /uploads/ {
        alias /opt/logai/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app fallback.
    location / {
        try_files $uri /index.html;
    }
}
